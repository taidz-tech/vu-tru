<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Thiên Hà Xoắn Ốc</title>
<style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #01030a; }
    canvas { display: block; width: 100%; height: 100%; }
    .vignette {
        position: fixed; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at center, transparent 25%, rgba(0,0,0,.12) 57%, rgba(0,0,0,.72) 100%);
    }
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="vignette"></div>
<script>
(() => {
    'use strict';

    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d', { alpha: false });
    const TAU = Math.PI * 2;
    const rand = (min, max) => Math.random() * (max - min) + min;
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const rgba = (color, alpha) => `rgba(${color[0]},${color[1]},${color[2]},${alpha})`;

    let W = 0, H = 0, DPR = 1, time = 0;
    let stars = [], dust = [], cornerGalaxies = [], centralParticles = [];
    let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;

    function gaussian() {
        let u = 0, v = 0;
        while (!u) u = Math.random();
        while (!v) v = Math.random();
        return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v);
    }

    const GALAXY_DATA = [
        { x: .09, y: .12, radius: 165, flatten: .46, tilt: -.18, arms: 3, twist: 2.55, rotation: .15, spin: .0019, colorA: [80,155,255], colorB: [205,95,255], core: [255,247,235], density: 1250 },
        { x: .91, y: .12, radius: 126, flatten: .57, tilt: .30, arms: 3, twist: 2.35, rotation: 2.15, spin: -.00225, colorA: [255,100,42], colorB: [255,204,90], core: [255,242,214], density: 1050 },
        { x: .09, y: .88, radius: 145, flatten: .44, tilt: -.28, arms: 4, twist: 2.72, rotation: .72, spin: .00165, colorA: [50,150,255], colorB: [85,230,255], core: [248,252,255], density: 1150 },
        { x: .91, y: .88, radius: 185, flatten: .46, tilt: .10, arms: 3, twist: 2.30, rotation: -.35, spin: .00135, colorA: [74,150,255], colorB: [255,196,94], core: [255,250,224], density: 1450 }
    ];

    class CornerGalaxy {
        constructor(data) {
            this.data = data;
            this.scale = clamp(Math.min(W, H) / 1100 * .32, .12, .34);
            this.radius = data.radius * this.scale;
            this.rotation = data.rotation;
            this.particles = [];
            this.knots = [];
            this.createParticles();
            this.createKnots();
        }

        createParticles() {
            const count = Math.floor(this.data.density * clamp(W / 1200, .65, 1) * this.scale * this.scale * 9);
            for (let i = 0; i < count; i++) {
                const arm = Math.floor(Math.random() * this.data.arms);
                const r = this.radius * Math.pow(Math.random(), .66);
                const angle = arm * TAU / this.data.arms + this.data.twist * Math.log(1 + r / 13);
                const colorPick = Math.random();
                const color = colorPick < .68 ? this.data.colorA : colorPick < .9 ? this.data.colorB : [255,239,211];
                this.particles.push({
                    r: Math.max(1, r + gaussian() * (1 + r * .018)),
                    angle: angle + gaussian() * (.035 + r / this.radius * .075),
                    drift: rand(-.14,.14), size: rand(.35,1.45), alpha: rand(.3,.9),
                    phase: Math.random() * TAU, color
                });
            }
        }

        createKnots() {
            for (let i = 0; i < Math.floor(this.radius / 11); i++) {
                const arm = Math.floor(Math.random() * this.data.arms);
                const r = rand(this.radius * .3, this.radius * .95);
                this.knots.push({
                    r,
                    angle: arm * TAU / this.data.arms + this.data.twist * Math.log(1 + r / 13),
                    size: rand(.8,1.8), phase: Math.random() * TAU,
                    color: Math.random() < .62 ? this.data.colorB : [255,240,218]
                });
            }
        }

        point(r, angle) {
            const x = Math.cos(angle) * r;
            const y = Math.sin(angle) * r * this.data.flatten;
            const c = Math.cos(this.data.tilt), s = Math.sin(this.data.tilt);
            return { x: x * c - y * s, y: x * s + y * c };
        }

        draw() {
            const d = this.data, cx = W * d.x, cy = H * d.y, r = this.radius;
            this.rotation += d.spin;
            ctx.save();
            ctx.translate(cx, cy);
            ctx.globalCompositeOperation = 'lighter';

            const halo = ctx.createRadialGradient(0,0,0,0,0,r * 1.15);
            halo.addColorStop(0, rgba(d.core,.28));
            halo.addColorStop(.18, rgba(d.colorB,.17));
            halo.addColorStop(.55, rgba(d.colorA,.07));
            halo.addColorStop(1, rgba(d.colorA,0));
            ctx.fillStyle = halo;
            ctx.beginPath();
            ctx.ellipse(0,0,r*1.15,r*d.flatten*1.15,0,0,TAU);
            ctx.fill();

            for (let arm = 0; arm < d.arms; arm++) {
                ctx.beginPath();
                for (let i = 0; i <= 44; i++) {
                    const pr = r * (.08 + .93 * i / 44);
                    const a = this.rotation + arm * TAU / d.arms + d.twist * Math.log(1 + pr / 13);
                    const p = this.point(pr,a);
                    if (!i) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
                }
                ctx.strokeStyle = rgba(d.colorA,.055);
                ctx.lineWidth = Math.max(3,r*.075);
                ctx.shadowBlur = 14;
                ctx.shadowColor = rgba(d.colorA,.18);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;

            for (const p of this.particles) {
                p.phase += .012;
                const q = this.point(p.r, p.angle + this.rotation + p.drift * Math.sin(p.phase));
                ctx.globalAlpha = p.alpha * (.82 + .18 * Math.sin(p.phase));
                ctx.fillStyle = rgba(p.color,1);
                ctx.beginPath();
                ctx.arc(q.x,q.y,p.size,0,TAU);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            for (const k of this.knots) {
                k.phase += .018;
                const q = this.point(k.r,k.angle + this.rotation);
                const pulse = 1 + .12 * Math.sin(k.phase);
                const glow = ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,k.size*7*pulse);
                glow.addColorStop(0,'rgba(255,255,255,.72)');
                glow.addColorStop(.25,rgba(k.color,.38));
                glow.addColorStop(1,rgba(k.color,0));
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(q.x,q.y,k.size*7*pulse,0,TAU);
                ctx.fill();
            }

            const core = ctx.createRadialGradient(0,0,0,0,0,r*.28);
            core.addColorStop(0,'rgba(255,255,255,.98)');
            core.addColorStop(.12,rgba(d.core,.8));
            core.addColorStop(.5,rgba(d.colorB,.2));
            core.addColorStop(1,rgba(d.colorA,0));
            ctx.fillStyle = core;
            ctx.beginPath();
            ctx.ellipse(0,0,r*.28,r*d.flatten*.28,0,0,TAU);
            ctx.fill();
            ctx.restore();
        }
    }

    function makeCentralParticle() {
        const rn = Math.pow(Math.random(), .62);
        const arm = Math.floor(Math.random() * 3);
        const colorPick = Math.random();
        let color;
        if (colorPick < .38) color = [255,rand(105,175),rand(175,235)];
        else if (colorPick < .72) color = [rand(55,125),rand(155,225),255];
        else color = [rand(190,255),rand(195,255),255];
        return {
            rn, r: rn * Math.min(W,H) * .39,
            a: arm * TAU / 3 + rn * 6.5 + gaussian() * (.08 + rn * .33),
            z: gaussian(), spin: rand(.00065,.00145), size: rand(.4,1.45) * (Math.random() < .035 ? 2.2 : 1),
            alpha: rand(.2,.8), phase: Math.random() * TAU, color
        };
    }

    function rebuildScene() {
        const area = W * H;
        stars = Array.from({length: Math.floor(clamp(area / 2600, 300, 1100))}, () => ({
            x: Math.random()*W, y: Math.random()*H,
            size: Math.random()<.1 ? rand(1.1,2) : rand(.25,.9),
            alpha: rand(.2,.85), phase: Math.random()*TAU, speed: rand(.002,.009),
            color: Math.random()<.18 ? [255,220,175] : [210,230,255]
        }));
        dust = Array.from({length: Math.floor(clamp(area / 6000, 180, 600))}, () => ({
            x: Math.random()*W, y: Math.random()*H, size: rand(.2,.65), alpha: rand(.025,.11),
            color: Math.random()<.6 ? [100,160,255] : [255,160,90]
        }));
        cornerGalaxies = GALAXY_DATA.map(data => new CornerGalaxy(data));
        const count = Math.floor(clamp(area / 700, 2400, 4600));
        centralParticles = Array.from({length: count}, makeCentralParticle);
    }

    function drawBackground() {
        const gradient = ctx.createRadialGradient(W*.5,H*.46,0,W*.5,H*.46,Math.max(W,H)*.78);
        gradient.addColorStop(0,'#07111f');
        gradient.addColorStop(.42,'#020713');
        gradient.addColorStop(1,'#010208');
        ctx.fillStyle = gradient;
        ctx.fillRect(0,0,W,H);

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        const nebulae = [
            [.25,.29, .20,.28, 'rgba(45,105,255,.10)'],
            [.77,.70, .24,.22, 'rgba(125,65,210,.075)'],
            [.49,.18, .20,.16, 'rgba(255,115,65,.045)']
        ];
        for (const [nx,ny,sx,sy,color] of nebulae) {
            const x=W*nx, y=H*ny, rx=W*sx, ry=H*sy;
            const cloud=ctx.createRadialGradient(x,y,0,x,y,Math.max(rx,ry));
            cloud.addColorStop(0,color); cloud.addColorStop(1,'rgba(0,0,0,0)');
            ctx.fillStyle=cloud; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,-.3,0,TAU); ctx.fill();
        }
        ctx.restore();
    }

    function drawCentralGalaxy() {
        const R = Math.min(W,H) * .43;
        const cx = W*.5 + mouseX*2, cy = H*.5 + mouseY*1.2;
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(-.12);
        ctx.scale(1,.39);
        ctx.globalCompositeOperation = 'lighter';

        const halo = ctx.createRadialGradient(0,0,0,0,0,R*1.18);
        halo.addColorStop(0,'rgba(90,155,255,.16)');
        halo.addColorStop(.32,'rgba(55,95,205,.09)');
        halo.addColorStop(.7,'rgba(35,55,105,.035)');
        halo.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=halo; ctx.beginPath(); ctx.arc(0,0,R*1.18,0,TAU); ctx.fill();

        for (const p of centralParticles) {
            p.r -= .12;
            p.a -= p.spin * 1.6;
            if (p.r < 3) {
                const next=makeCentralParticle();
                p.r=R*rand(.92,1.02); p.a=next.a; p.z=next.z; p.phase=next.phase;
            }
            const normalized=clamp(p.r/R,0,1);
            const arm=.45+.55*Math.pow(Math.max(0,Math.sin(p.a*3-normalized*6.4+p.phase)),5);
            const x=Math.cos(p.a)*p.r;
            const y=Math.sin(p.a)*p.r+p.z*(3+normalized*15);
            const alpha=clamp(p.alpha*(.24+arm*.9)*(1.25-normalized*.55),.02,.95);
            ctx.fillStyle=rgba(p.color,alpha*(.84+.16*Math.sin(time*.002+p.phase)));
            ctx.beginPath(); ctx.arc(x,y,p.size,0,TAU); ctx.fill();
        }

        for (let arm=0; arm<3; arm++) {
            ctx.beginPath();
            for (let i=0;i<=140;i++) {
                const u=i/140, a=arm*TAU/3+u*TAU*1.65+time*.000025;
                const r=R*(.08+u*.84), x=Math.cos(a)*r, y=Math.sin(a)*r;
                if (!i) ctx.moveTo(x,y); else ctx.lineTo(x,y);
            }
            ctx.strokeStyle=arm===1?'rgba(255,125,195,.055)':'rgba(100,195,255,.07)';
            ctx.lineWidth=2.4; ctx.stroke();
        }

        const coreHalo=ctx.createRadialGradient(0,0,0,0,0,Math.min(95,R*.32));
        coreHalo.addColorStop(0,'rgba(255,255,255,.95)');
        coreHalo.addColorStop(.12,'rgba(195,230,255,.58)');
        coreHalo.addColorStop(.42,'rgba(255,120,190,.12)');
        coreHalo.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=coreHalo; ctx.beginPath(); ctx.arc(0,0,Math.min(95,R*.32),0,TAU); ctx.fill();
        ctx.restore();
    }

    function drawStars() {
        ctx.globalCompositeOperation='lighter';
        for (const star of stars) {
            star.phase += star.speed;
            const alpha=star.alpha*(.78+.22*Math.sin(star.phase));
            ctx.fillStyle=rgba(star.color,alpha);
            ctx.beginPath(); ctx.arc(star.x,star.y,star.size,0,TAU); ctx.fill();
            if (star.size>1.1) {
                ctx.fillStyle=rgba(star.color,alpha*.16);
                ctx.beginPath(); ctx.arc(star.x,star.y,star.size*4,0,TAU); ctx.fill();
            }
        }
        for (const p of dust) {
            ctx.fillStyle=rgba(p.color,p.alpha);
            ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,TAU); ctx.fill();
        }
        ctx.globalCompositeOperation='source-over';
    }

    function draw() {
        time++;
        mouseX += (targetX-mouseX)*.035;
        mouseY += (targetY-mouseY)*.035;
        drawBackground();
        drawStars();
        drawCentralGalaxy();
        for (const galaxy of cornerGalaxies) galaxy.draw();
        requestAnimationFrame(draw);
    }

    window.addEventListener('pointermove', event => {
        targetX=(event.clientX/W-.5)*2;
        targetY=(event.clientY/H-.5)*2;
    }, {passive:true});

    window.addEventListener('resize', () => {
        W=window.innerWidth; H=window.innerHeight;
        DPR=Math.min(window.devicePixelRatio||1,1.5);
        canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
        canvas.style.width=W+'px'; canvas.style.height=H+'px';
        ctx.setTransform(DPR,0,0,DPR,0,0);
        rebuildScene();
    });

    window.dispatchEvent(new Event('resize'));
    requestAnimationFrame(draw);
})();
</script>
</body>
</html>
